<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Alumnos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    

</head>

<body class="page-surface">

<div class="container mt-5">

    <h2 class="text-center mb-4">Lista de Alumnos</h2>

    <div class="table-responsive">

        <table class="table table-bordered table-hover shadow page-card">

            <thead class="table-dark">

                <tr>

                    <th>Nombre</th>
                    <th>Matrícula</th>
                    <th>Carrera</th>
                    <th>Grupo</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaAlumnos">

            </tbody>

        </table>

    </div>

</div>

<!-- MODAL EDITAR -->

<div class="modal fade" id="modalEditar" tabindex="-1">

    <div class="modal-dialog">

    <div class="modal-content page-card">

            <div class="modal-header">

                <h5 class="modal-title">
                    Editar Alumno
                </h5>

                <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Matrícula</label>
                    <input type="text" id="editMatricula" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Carrera</label>
                    <input type="text" id="editCarrera" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Grupo</label>
                    <input type="text" id="editGrupo" class="form-control">
                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button class="btn btn-primary"
                onclick="actualizarAlumno()">

                    Guardar Cambios

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">

// ================= FIREBASE =================

import { db } from "./firebase-config.js";
import {
        collection,
        getDocs,
        deleteDoc,
        doc,
        updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ================= MOSTRAR =================

async function cargarAlumnos(){

    const tabla = document.getElementById("tablaAlumnos");

    tabla.innerHTML = "";

    const querySnapshot = await getDocs(collection(db, "alumnos"));

    querySnapshot.forEach((documento) => {

        let alumno = documento.data();

        tabla.innerHTML += `

        <tr>

            <td>${alumno.nombre}</td>
            <td>${alumno.matricula}</td>
            <td>${alumno.carrera}</td>
            <td>${alumno.grupo}</td>

            <td>

                <button class="btn btn-warning btn-sm"
                onclick="editarAlumno(
                    '${documento.id}',
                    '${alumno.nombre}',
                    '${alumno.matricula}',
                    '${alumno.carrera}',
                    '${alumno.grupo}'
                )">

                    Editar

                </button>

                <button class="btn btn-danger btn-sm"
                onclick="eliminarAlumno('${documento.id}')">

                    Eliminar

                </button>

            </td>

        </tr>

        `;

    });

}

// ================= ELIMINAR =================

window.eliminarAlumno = async function(id){

    let confirmar = confirm("¿Eliminar alumno?");

    if(confirmar){

        await deleteDoc(doc(db, "alumnos", id));

        alert("Alumno eliminado");

        cargarAlumnos();

    }

}

// ================= EDITAR =================

window.editarAlumno = function(id,nombre,matricula,carrera,grupo){

    document.getElementById("editId").value = id;
    document.getElementById("editNombre").value = nombre;
    document.getElementById("editMatricula").value = matricula;
    document.getElementById("editCarrera").value = carrera;
    document.getElementById("editGrupo").value = grupo;

    let modal = new bootstrap.Modal(
        document.getElementById("modalEditar")
    );

    modal.show();

}

// ================= ACTUALIZAR =================

window.actualizarAlumno = async function(){

    let id = document.getElementById("editId").value;

    let nombre = document.getElementById("editNombre").value;

    let matricula = document.getElementById("editMatricula").value;

    let carrera = document.getElementById("editCarrera").value;

    let grupo = document.getElementById("editGrupo").value;

    await updateDoc(doc(db, "alumnos", id), {

        nombre: nombre,
        matricula: matricula,
        carrera: carrera,
        grupo: grupo,
        qr: matricula

    });

    alert("Alumno actualizado");

    let modal =
    bootstrap.Modal.getInstance(
        document.getElementById("modalEditar")
    );

    modal.hide();

    cargarAlumnos();

}

// ================= INICIAR =================

cargarAlumnos();

</script>

</body>
</html>
