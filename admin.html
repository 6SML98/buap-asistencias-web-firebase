<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Force background for admin page */
        
    </style>

</head>
<body class="page-surface">

<nav class="navbar navbar-dark" style="background:linear-gradient(90deg,var(--bg-gradient-1),#071033)">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1" style="color:rgb(46, 39, 1);">
            Panel Administrador
        </span>
    </div>
</nav>

<div class="container mt-5 admin-panel">

    <div class="row g-4">

        <!-- Registrar -->
        <div class="col-md-3">
            <div class="card menu-card shadow text-center p-4">

                <i class="bi bi-person-plus-fill icono text-primary"></i>

                <h4 class="mt-3">Registrar Alumno</h4>

                <a href="registrar.html" class="btn btn-primary mt-3">
                    Abrir
                </a>

            </div>
        </div>

        <!-- Lista -->
        <div class="col-md-3">
            <div class="card menu-card shadow text-center p-4">

                <i class="bi bi-people-fill icono text-success"></i>

                <h4 class="mt-3">Lista de Alumnos</h4>

                <a href="lista.html" class="btn btn-success mt-3">
                    Abrir
                </a>

            </div>
        </div>

        <!-- Escanear -->
        <div class="col-md-3">
            <div class="card menu-card shadow text-center p-4">

                <i class="bi bi-qr-code-scan icono text-dark"></i>

                <h4 class="mt-3">Escanear QR</h4>

                <a href="scanner.html" class="btn btn-dark mt-3">
                    Abrir
                </a>

            </div>
        </div>

        <!-- Asistencias -->
        <div class="col-md-3">
            <div class="card menu-card shadow text-center p-4">

                <i class="bi bi-calendar-check-fill icono text-danger"></i>

                <h4 class="mt-3">Asistencias</h4>

                <a href="asistencias.html" class="btn btn-danger mt-3">
                    Abrir
                </a>

            </div>
        </div>

    </div>

</div>

</body>
</html>
