<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escanear QR</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
    body{background:#f4f6f9;}
    #reader{width:100%;}
    video{border-radius:12px;}
    .scanner-card{border-radius:12px}
    .control-btn{min-width:120px}
    #historial li{list-style:none;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.03)}
</style>

</head>

<body>

<!-- header removed per user request -->

<main class="container mb-4">
    <div class="row">
        <div class="col-12 col-md-8 mb-3">
            <div class="card shadow scanner-card p-3 h-100">
                <h5 class="mb-3">Visor</h5>
                <div id="reader" class="mb-3"></div>
                <div class="d-flex gap-2">
                    <button id="btn-start" class="btn btn-success control-btn">Iniciar</button>
                    <button id="btn-stop" class="btn btn-outline-secondary control-btn">Detener</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4 mb-3">
            <div class="card shadow p-3 h-100">
                <h5>Resultado</h5>
                <div id="resultado" class="alert alert-info">Esperando escaneo...</div>

                <h6 class="mt-3">Historial reciente</h6>
                <ul id="historial" class="p-0 mb-3">
                </ul>

                <div class="text-muted small">Si el alumno ya registró asistencia, aparecerá un aviso.</div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted mb-4">&copy; Sistema de Asistencias</footer>

<script type="module">

// ================= FIREBASE =================

import { db } from "./firebase-config.js";
import {
    collection,
    doc,
    getDoc,
    query,
    where,
    getDocs,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ================= ESPERAR CORDOVA =================

function onReady(){
    solicitarPermiso();
}

if (window.cordova) {
    document.addEventListener("deviceready", onReady, false);
} else {
    document.addEventListener("DOMContentLoaded", onReady);
}

// ================= PEDIR PERMISO =================

function solicitarPermiso(){
    // Si Cordova y el plugin de permisos están disponibles, usarlos
    if (window.cordova && cordova.plugins && cordova.plugins.permissions){

        cordova.plugins.permissions.requestPermission(

            cordova.plugins.permissions.CAMERA,

            function(status){

                if(status.hasPermission){

                    iniciarScanner();

                }else{

                    document.getElementById("resultado").innerHTML =
                    "Permiso de cámara denegado";

                }

            },

            function(){

                document.getElementById("resultado").innerHTML =
                "Error solicitando permisos";

            }

        );

    } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){

        // Fallback para navegador: solicitar permiso con getUserMedia
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            // cerramos el stream inmediatamente, solo verificamos permiso
            stream.getTracks().forEach(t => t.stop());
            iniciarScanner();
        })
        .catch(err => {
            document.getElementById("resultado").innerHTML =
            "Permiso de cámara denegado o no disponible: " + err.message;
        });

    } else {

        document.getElementById("resultado").innerHTML =
        "No es posible acceder a la cámara en este dispositivo.";

    }

}



// ================= SCANNER =================


let html5QrCode = null;
let procesandoEscaneo = false;
let ultimoCodigoLeido = "";
let ultimaLecturaTs = 0;

function iniciarScanner(){

    if (!html5QrCode){
        html5QrCode = new Html5Qrcode("reader");
    }

    html5QrCode.start(

        { facingMode: "environment" },

        { fps: 10, qrbox: 250 },

        async (decodedText) => {
            const ahora = Date.now();

            if (procesandoEscaneo) {
                return;
            }

            if (decodedText === ultimoCodigoLeido && ahora - ultimaLecturaTs < 3000) {
                return;
            }

            procesandoEscaneo = true;
            ultimoCodigoLeido = decodedText;
            ultimaLecturaTs = ahora;

            try {
                await html5QrCode.stop();
            } catch (e) {
                // ignore
            }

            await registrarAsistencia(decodedText);
        },

        (errorMessage) => {
            // silencioso
        }

    ).catch(err => {

        document.getElementById("resultado").innerHTML =
        "Error al abrir cámara: " + err;

    });

}

// ================= REGISTRAR =================

async function registrarAsistencia(matricula){

    try {
        matricula = String(matricula).trim();
        addHistory(matricula);

        document.getElementById("resultado").innerHTML =
        "Buscando alumno...";

        const fecha = new Date();
        const fechaTexto = fecha.toISOString().split("T")[0];

        const q = query(
            collection(db,"alumnos"),
            where("matricula","==",matricula)
        );

        const querySnapshot = await getDocs(q);

        if(!querySnapshot.empty){
            const alumno = querySnapshot.docs[0].data();

            const asistenciaId = `${alumno.matricula}_${fechaTexto}`;
            const asistenciaRef = doc(db, "asistencias", asistenciaId);
            const asistenciaExistente = await getDoc(asistenciaRef);

            if (asistenciaExistente.exists()) {
                document.getElementById("resultado").innerHTML = `
                    <b>Ya registraste tu asistencia hoy</b><br><br>
                    Nombre: ${alumno.nombre}<br>
                    Matrícula: ${alumno.matricula}
                `;
            } else {
                const horaTexto = fecha.toLocaleTimeString();

                await setDoc(asistenciaRef, {
                    nombre: alumno.nombre,
                    matricula: alumno.matricula,
                    carrera: alumno.carrera,
                    grupo: alumno.grupo,
                    fecha: fechaTexto,
                    hora: horaTexto
                });

                document.getElementById("resultado").innerHTML = `
                    <b>Asistencia registrada</b><br><br>
                    Nombre: ${alumno.nombre}<br>
                    Matrícula: ${alumno.matricula}
                `;
            }

            setTimeout(() => {
                procesandoEscaneo = false;
                ultimoCodigoLeido = "";
                ultimaLecturaTs = 0;
                iniciarScanner();
            }, 3000);

        } else {

            document.getElementById("resultado").innerHTML =
            "Alumno no encontrado";
            procesandoEscaneo = false;

        }
    } catch (error) {
        document.getElementById("resultado").innerHTML =
        "Error registrando asistencia: " + error.message;
        procesandoEscaneo = false;
    }

}

    // ================= UTILIDADES (historial y controles) =================

    function addHistory(text){
        try{
            const ul = document.getElementById('historial');
            const li = document.createElement('li');
            li.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> — ${text}`;
            ul.insertBefore(li, ul.firstChild);
            while(ul.children.length > 10) ul.removeChild(ul.lastChild);
        }catch(e){/* ignore */}
    }

    function detenerScanner(){
        if (html5QrCode){
            html5QrCode.stop().then(()=>{
                document.getElementById('resultado').innerText = 'Scanner detenido';
            }).catch(()=>{
                document.getElementById('resultado').innerText = 'Error deteniendo scanner';
            });
        }
    }

    // enlazar botones
    document.getElementById('btn-start').addEventListener('click', ()=>{
        iniciarScanner();
    });

    document.getElementById('btn-stop').addEventListener('click', ()=>{
        detenerScanner();
    });

</script>

</body>
</html>
