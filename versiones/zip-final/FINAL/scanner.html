<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- QR -->

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body style="background:#f4f6f9;">

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Escanear Código QR
        </h2>

        <div id="reader"></div>

        <div id="mensaje"
        class="mt-4 text-center"></div>

    </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getFirestore,
    collection,
    addDoc,
    query,
    where,
    getDocs

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG

const firebaseConfig = {
  apiKey: "TU_FIREBASE_API_KEY",
  authDomain: "finalappmovil-119be.firebaseapp.com",
  projectId: "finalappmovil-119be",
  storageBucket: "finalappmovil-119be.firebasestorage.app",
  messagingSenderId: "772377773811",
  appId: "1:772377773811:web:c4afdce5211a1acd2d1986",
  measurementId: "G-W2R04C2MV6"
};

// INICIALIZAR

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// ================= ESCANEAR =================

let ultimaMatricula = "";

// CUANDO DETECTA QR

async function onScanSuccess(decodedText){

    // EVITAR REPETIDOS

    if(decodedText === ultimaMatricula){

        return;

    }

    ultimaMatricula = decodedText;

    // BUSCAR ALUMNO

    const q = query(
        collection(db,"alumnos"),
        where("matricula","==",decodedText)
    );

    const querySnapshot = await getDocs(q);

    if(!querySnapshot.empty){

        querySnapshot.forEach(async(docu)=>{

            let alumno = docu.data();

            // FECHA

            let fechaActual = new Date();

            let fecha =
            fechaActual.toISOString().split('T')[0];

            let hora =
            fechaActual.toLocaleTimeString();

            // GUARDAR ASISTENCIA

            await addDoc(collection(db,"asistencias"),{

                nombre: alumno.nombre,
                matricula: alumno.matricula,
                carrera: alumno.carrera,
                grupo: alumno.grupo,
                fecha: fecha,
                hora: hora

            });

            // MENSAJE

            document.getElementById("mensaje").innerHTML = `

                <div class="alert alert-success">

                    <h4>Asistencia Registrada</h4>

                    <strong>${alumno.nombre}</strong><br>

                    Matrícula:
                    ${alumno.matricula}

                </div>

            `;

        });

    }
    else{

        document.getElementById("mensaje").innerHTML = `

            <div class="alert alert-danger">

                Alumno no encontrado

            </div>

        `;

    }

}

// ================= INICIAR CAMARA =================

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

    if(devices && devices.length){

        html5QrCode.start(

            devices[0].id,

            {
                fps: 10,
                qrbox: 250
            },

            onScanSuccess

        );

    }

});

</script>

</body>
</html>
