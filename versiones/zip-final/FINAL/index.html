<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background: linear-gradient(135deg,#0d6efd,#0a2a66);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-opcion{
            transition: 0.3s;
            border-radius: 20px;
            cursor: pointer;
        }

        .card-opcion:hover{
            transform: scale(1.05);
        }

        .icono{
            font-size: 70px;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="text-center text-white mb-5">
        <h1 class="fw-bold">Control de Asistencia QR</h1>
        <p>Sistema Web con Firebase</p>
    </div>

    <div class="row justify-content-center g-4">

        <!-- ADMIN -->
        <div class="col-md-4">
            <div class="card shadow-lg p-4 text-center card-opcion">
                <div class="card-body">

                    <i class="bi bi-person-workspace icono"></i>

                    <h3 class="mt-3">Administrador</h3>

                    <p>
                        Gestión de alumnos y asistencias
                    </p>

                    <a href="admin.html" class="btn btn-primary w-100">
                        Entrar
                    </a>

                </div>
            </div>
        </div>

        <!-- ALUMNO -->
        <div class="col-md-4">
            <div class="card shadow-lg p-4 text-center card-opcion">
                <div class="card-body">

                    <i class="bi bi-mortarboard-fill icono"></i>

                    <h3 class="mt-3">Alumno</h3>

                    <p>
                        Consulta de QR y asistencias
                    </p>

                    <a href="alumno.html" class="btn btn-success w-100">
                        Entrar
                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
