<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumno QR</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- QR -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Mi Código QR
                </h2>

                <div class="mb-3">

                    <label>Matrícula</label>

                    <input type="text"
                    id="matricula"
                    class="form-control">

                </div>

                <button class="btn btn-primary w-100"
                onclick="buscarAlumno()">

                    Generar QR

                </button>

                <hr>

                <div id="infoAlumno"
                class="text-center"></div>

                <div class="d-flex justify-content-center mt-4">

                    <div id="qrcode"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getFirestore,
    collection,
    query,
    where,
    getDocs

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG

const firebaseConfig = {
  apiKey: "TU_FIREBASE_API_KEY",
  authDomain: "finalappmovil-119be.firebaseapp.com",
  projectId: "finalappmovil-119be",
  storageBucket: "finalappmovil-119be.firebasestorage.app",
  messagingSenderId: "772377773811",
  appId: "1:772377773811:web:c4afdce5211a1acd2d1986",
  measurementId: "G-W2R04C2MV6"
};

// INICIALIZAR

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// ================= BUSCAR =================

window.buscarAlumno = async function(){

    let matricula =
    document.getElementById("matricula").value;

    // LIMPIAR QR

    document.getElementById("qrcode").innerHTML = "";

    // BUSCAR

    const q = query(
        collection(db,"alumnos"),
        where("matricula","==",matricula)
    );

    const querySnapshot = await getDocs(q);

    if(!querySnapshot.empty){

        querySnapshot.forEach((docu)=>{

            let alumno = docu.data();

            // MOSTRAR INFO

            document.getElementById("infoAlumno").innerHTML = `

                <h4>${alumno.nombre}</h4>

                <p>
                    ${alumno.carrera}<br>
                    Grupo ${alumno.grupo}
                </p>

            `;

            // GENERAR QR

            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: alumno.matricula,
                    width: 250,
                    height: 250
                }
            );

        });

    }
    else{

        alert("Alumno no encontrado");

    }

}

</script>

</body>
</html>
