<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Registro de Asistencias
    </h2>

    <div class="table-responsive">

        <table class="table table-bordered table-hover shadow">

            <thead class="table-dark">

                <tr>

                    <th>Nombre</th>
                    <th>Matrícula</th>
                    <th>Carrera</th>
                    <th>Grupo</th>
                    <th>Fecha</th>
                    <th>Hora</th>

                </tr>

            </thead>

            <tbody id="tablaAsistencias">

            </tbody>

        </table>

    </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getFirestore,
    collection,
    getDocs

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG

const firebaseConfig = {
  apiKey: "TU_FIREBASE_API_KEY",
  authDomain: "finalappmovil-119be.firebaseapp.com",
  projectId: "finalappmovil-119be",
  storageBucket: "finalappmovil-119be.firebasestorage.app",
  messagingSenderId: "772377773811",
  appId: "1:772377773811:web:c4afdce5211a1acd2d1986",
  measurementId: "G-W2R04C2MV6"
};

// INICIALIZAR

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// ================= CARGAR =================

async function cargarAsistencias(){

    const tabla =
    document.getElementById("tablaAsistencias");

    tabla.innerHTML = "";

    const querySnapshot =
    await getDocs(collection(db,"asistencias"));

    querySnapshot.forEach((documento)=>{

        let asistencia = documento.data();

        tabla.innerHTML += `

        <tr>

            <td>${asistencia.nombre}</td>
            <td>${asistencia.matricula}</td>
            <td>${asistencia.carrera}</td>
            <td>${asistencia.grupo}</td>
            <td>${asistencia.fecha}</td>
            <td>${asistencia.hora}</td>

        </tr>

        `;

    });

}

// ================= INICIAR =================

cargarAsistencias();

</script>

</body>
</html>
