<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alumno</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .contenedor{max-width:600px;margin:auto;margin-top:40px}
    </style>
    

</head>
<body class="page-surface">

<div class="container">

    <div class="contenedor">

        <div class="card page-card shadow p-4">

            <h2 class="text-center mb-4">
                Registrar Alumno
            </h2>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Matrícula</label>
                <input type="text" id="matricula" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Carrera</label>
                <input type="text" id="carrera" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Grupo</label>
                <input type="text" id="grupo" class="form-control">
            </div>

            <button class="btn btn-primary w-100" onclick="guardarAlumno()">Guardar Alumno</button>

        </div>

    </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { db } from "./firebase-config.js";
import {
        collection,
        addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ================= FUNCION GUARDAR =================

window.guardarAlumno = async function(){

    // OBTENER DATOS

    let nombre = document.getElementById("nombre").value;
    let matricula = document.getElementById("matricula").value;
    let carrera = document.getElementById("carrera").value;
    let grupo = document.getElementById("grupo").value;

    // VALIDACION

    if(nombre == "" || matricula == ""){

        alert("Complete los campos");

        return;
    }

    try{

        // GUARDAR EN FIREBASE

        await addDoc(collection(db, "alumnos"), {

            nombre: nombre,
            matricula: matricula,
            carrera: carrera,
            grupo: grupo,
            qr: matricula,
            fechaRegistro: new Date()

        });

        alert("Alumno registrado correctamente");

        // LIMPIAR INPUTS

        document.getElementById("nombre").value = "";
        document.getElementById("matricula").value = "";
        document.getElementById("carrera").value = "";
        document.getElementById("grupo").value = "";

    }
    catch(error){

        console.log(error);

        alert("Error al guardar");

    }

}

</script>

</body>
</html>
